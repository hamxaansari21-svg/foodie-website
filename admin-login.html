<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Foodie - Admin Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            🍔 <span>Foodie Admin</span>
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

        </div>

    </nav>



    <!-- HEADER -->

    <section class="admin-header">

        <div class="admin-tag">
            🔐 ADMIN LOGIN
        </div>

        <h1>
            Welcome Back
            <span>Admin</span>
        </h1>

        <p>
            Login to manage your Foodie website.
        </p>

    </section>



    <!-- LOGIN -->

    <section style="
        max-width:450px;
        margin:30px auto 80px;
        padding:0 20px;
    ">

        <div class="admin-card">

            <h2>
                🔐 Admin Login
            </h2>

            <p class="admin-subtitle">
                Enter your admin credentials.
            </p>



            <form id="login-form">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter admin email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter admin password"
                        required
                    >

                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="admin-submit-btn"
                >
                    🔐 Login
                </button>


            </form>


        </div>

    </section>



    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="admin-login.js"
    ></script>


</body>

</html>
